<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" fill="none">
  <defs>
    <!-- Background and Glass Gradients -->
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="100%" stop-color="rgba(241, 245, 249, 0.9)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Laptop -->
  <circle cx="400" cy="270" r="220" fill="#3B82F6" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="280" cy="220" r="140" fill="#06B6D4" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="540" cy="300" r="120" fill="#10B981" opacity="0.08" filter="url(#softGlow)" />

  <!-- LAPTOP HARDWARE -->
  <!-- Base Stand / Shadow -->
  <ellipse cx="400" cy="465" rx="310" ry="20" fill="#0F172A" opacity="0.2" filter="url(#softGlow)" />
  
  <!-- Laptop Lower Base -->
  <path d="M 140 435 L 660 435 L 690 445 L 110 445 Z" fill="#94A3B8" />
  <path d="M 110 445 Q 400 458 690 445 L 685 450 Q 400 464 115 450 Z" fill="#64748B" />
  <rect x="360" y="435" width="80" height="4" rx="2" fill="#CBD5E1" opacity="0.8" />

  <!-- Laptop Display Lid Frame -->
  <rect x="160" y="80" width="480" height="345" rx="16" fill="url(#laptopBody)" filter="url(#dropShadow)" stroke="#475569" stroke-width="2" />
  <!-- Display Bezel Inner -->
  <rect x="172" y="92" width="456" height="322" rx="10" fill="#0F172A" />

  <!-- Web Camera Dot -->
  <circle cx="400" cy="86" r="2.5" fill="#38BDF8" opacity="0.8" />

  <!-- NUVIO WORKSPACE SCREEN -->
  <rect x="176" y="96" width="448" height="314" rx="8" fill="#F8FAFC" />

  <!-- Workspace Window Header -->
  <rect x="176" y="96" width="448" height="30" rx="8" fill="#0F172A" />
  <!-- Window Controls -->
  <circle cx="194" cy="111" r="4" fill="#EF4444" />
  <circle cx="206" cy="111" r="4" fill="#F59E0B" />
  <circle cx="218" cy="111" r="4" fill="#10B981" />
  
  <!-- App Title & Local Status in Header -->
  <text x="240" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">NUVIO WORKSPACE</text>
  <rect x="370" y="103" width="130" height="16" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="0.8" />
  <circle cx="380" cy="111" r="2.5" fill="#10B981" />
  <text x="388" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#34D399">100% LOCAL SANDBOX</text>

  <!-- Left Sidebar (Page Thumbnails) -->
  <rect x="176" y="126" width="70" height="284" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
  <!-- Thumbnail 1 (Active) -->
  <rect x="184" y="136" width="54" height="68" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
  <rect x="189" y="142" width="30" height="4" rx="1" fill="#94A3B8" />
  <rect x="189" y="149" width="44" height="2" rx="1" fill="#CBD5E1" />
  <rect x="189" y="154" width="40" height="2" rx="1" fill="#CBD5E1" />
  <rect x="189" y="159" width="44" height="2" rx="1" fill="#CBD5E1" />
  <text x="207" y="196" font-family="monospace" font-size="8" font-weight="700" fill="#2563EB" text-anchor="middle">PAGE 1</text>

  <!-- Thumbnail 2 -->
  <rect x="184" y="212" width="54" height="68" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="189" y="218" width="28" height="4" rx="1" fill="#CBD5E1" />
  <rect x="189" y="225" width="44" height="2" rx="1" fill="#E2E8F0" />
  <rect x="189" y="230" width="38" height="2" rx="1" fill="#E2E8F0" />
  <text x="207" y="272" font-family="monospace" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle">PAGE 2</text>

  <!-- Thumbnail 3 -->
  <rect x="184" y="288" width="54" height="68" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="189" y="294" width="32" height="4" rx="1" fill="#CBD5E1" />
  <rect x="189" y="301" width="44" height="2" rx="1" fill="#E2E8F0" />
  <text x="207" y="348" font-family="monospace" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle">PAGE 3</text>

  <!-- Center Canvas Background -->
  <rect x="246" y="126" width="378" height="284" fill="#E2E8F0" opacity="0.6" />

  <!-- Top In-Canvas Toolbar -->
  <rect x="256" y="134" width="358" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#cardShadow)" />
  <rect x="264" y="139" width="38" height="16" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="272" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8">Edit</text>
  <text x="312" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Sign</text>
  <text x="342" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Merge</text>
  <text x="382" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Compress</text>
  <text x="436" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Organize</text>

  <rect x="548" y="139" width="58" height="16" rx="4" fill="url(#blueAccent)" />
  <text x="557" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Export ↑</text>

  <!-- Main Active PDF Document Page in Center -->
  <g transform="translate(290, 168)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="236" rx="4" fill="url(#docGrad)" stroke="#CBD5E1" stroke-width="1" />
    
    <!-- Document Header / Logo -->
    <rect x="20" y="20" width="36" height="8" rx="2" fill="#2563EB" />
    <rect x="20" y="32" width="120" height="4" rx="1.5" fill="#0F172A" />
    <rect x="20" y="40" width="80" height="3" rx="1" fill="#94A3B8" />

    <!-- Document Section 1: Positioned Text Block with Selection Handle -->
    <rect x="20" y="56" width="240" height="42" rx="4" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Transform Bounding Anchors -->
    <rect x="17" y="53" width="6" height="6" rx="1" fill="#2563EB" />
    <rect x="257" y="53" width="6" height="6" rx="1" fill="#2563EB" />
    <rect x="17" y="95" width="6" height="6" rx="1" fill="#2563EB" />
    <rect x="257" y="95" width="6" height="6" rx="1" fill="#2563EB" />

    <text x="28" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E293B">Non-Disclosure &amp; Security Agreement</text>
    <rect x="28" y="76" width="220" height="3" rx="1" fill="#64748B" opacity="0.8" />
    <rect x="28" y="83" width="190" height="3" rx="1" fill="#64748B" opacity="0.8" />
    <rect x="28" y="90" width="150" height="3" rx="1" fill="#64748B" opacity="0.8" />

    <!-- Cursor Pointer Editing in Real-Time -->
    <line x1="168" y1="62" x2="168" y2="72" stroke="#2563EB" stroke-width="1.8" />

    <!-- Document Section 2: Contract Text Lines -->
    <rect x="20" y="112" width="240" height="3" rx="1" fill="#94A3B8" opacity="0.5" />
    <rect x="20" y="120" width="210" height="3" rx="1" fill="#94A3B8" opacity="0.5" />
    <rect x="20" y="128" width="230" height="3" rx="1" fill="#94A3B8" opacity="0.5" />
    <rect x="20" y="136" width="170" height="3" rx="1" fill="#94A3B8" opacity="0.5" />

    <!-- Digital Signature Block with Verified Checkmark -->
    <rect x="20" y="154" width="140" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="28" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#64748B">SIGNATURE VERIFICATION</text>
    <!-- Script Signature Vector -->
    <path d="M 32 186 Q 48 174 62 184 T 92 180 T 118 176" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" />
    <!-- Green Verified Badge -->
    <circle cx="145" cy="175" r="7" fill="#10B981" />
    <path d="M 142 175 L 144 177 L 148 173" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stamp Element (Approved / Private) -->
    <rect x="180" y="154" width="80" height="42" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="220" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#059669" text-anchor="middle">VERIFIED</text>
    <text x="220" y="185" font-family="monospace" font-size="7" font-weight="600" fill="#10B981" text-anchor="middle">CLIENT-SIDE</text>
  </g>

  <!-- ==================================================== -->
  <!-- FLOATING ORBITAL GLASS CARDS & SATELLITES            -->
  <!-- ==================================================== -->

  <!-- Top-Left Floating Badge: Privacy Shield -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="160" height="52" rx="16" fill="url(#glassCard)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="12" y="12" width="28" height="28" rx="8" fill="url(#shieldGrad)" />
    <!-- Shield Icon -->
    <path d="M 26 19 L 33 22 L 33 28 C 33 33 26 36 26 36 C 26 36 19 33 19 28 L 19 22 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 23 27 L 25 29 L 29 25" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="48" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Zero Uploads</text>
    <text x="48" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Files stay on device</text>
  </g>

  <!-- Bottom-Left Floating Badge: Single Source of Truth -->
  <g transform="translate(70, 340)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="168" height="54" rx="16" fill="url(#glassCard)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="12" y="13" width="28" height="28" rx="8" fill="url(#blueAccent)" />
    <!-- Layered Document Icon -->
    <rect x="18" y="19" width="12" height="15" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="21" y1="23" x2="27" y2="23" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <line x1="21" y1="27" x2="25" y2="27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Canonical State</text>
    <text x="48" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">What you see = export</text>
  </g>

  <!-- Top-Right Floating Badge: Tool Palette Orbit -->
  <g transform="translate(585, 95)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="155" height="52" rx="16" fill="url(#glassCard)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="12" y="12" width="28" height="28" rx="8" fill="url(#cyanAccent)" />
    <!-- Vector Pen / Text Icon -->
    <path d="M 21 31 L 23 25 L 30 18 L 33 21 L 26 28 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
    <text x="48" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Direct Visual Edit</text>
    <text x="48" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">In-place font metrics</text>
  </g>

  <!-- Bottom-Right Floating Badge: Multi-Format Modular Pipeline -->
  <g transform="translate(575, 335)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="165" height="54" rx="16" fill="url(#glassCard)" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="12" y="13" width="28" height="28" rx="8" fill="url(#blueAccent)" />
    <!-- Arrows / Loop Icon -->
    <path d="M 20 27 Q 26 20 32 27" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 32 27 Q 26 34 20 27" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">One Workspace</text>
    <text x="48" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B">Edit · Sign · Merge · Export</text>
  </g>

</svg>
